[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qubo-classification-g44"
version = "0.1.0"
description = "QUBO-based feature selection and binary classification pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "dimod>=0.12.0",
    "dwave-neal>=0.6.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: exercises the command-line pipeline",
    "performance: runs performance benchmarks",
]
