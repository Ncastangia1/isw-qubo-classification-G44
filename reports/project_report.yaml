design_choices:
  correlation_computation: "Absolute Spearman rank correlation is used to measure feature–target relevance and feature–feature redundancy. Undefined correlations caused by constant inputs are treated as 0."
  QUBO_optimization_algorithm:
    algorithm_name: "Simulated annealing"
    library_used: "dwave-neal"
    reason_for_choice: "It provides a practical sampler for solving the QUBO feature-selection problem with a configurable random seed."
  classification_algorithm:
    algorithm_name: "Random Forest"
    library_used: "scikit-learn"
    reason_for_choice: "It was selected as the GUI default and provides a reproducible ensemble classifier for the binary classification task."
  gui_development: "Tkinter with ttk widgets; the GUI provides dataset loading, preprocessing, feature selection, model training, prediction, and results views."
  problems_encountered:
    - problem: "Feature selection could accept an empty feature set when zero fell within the allowed selection range, causing training to fail because the reduced dataset contained only the target column."
      solution: "Require at least one selected feature and clamp the rounded target feature count to a minimum of one."
  notes: "The GUI also supports Logistic Regression and Decision Tree classifiers. The classifier and random seed can be selected in the training tab."

